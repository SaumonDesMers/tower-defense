[package]
name = "another_unfinished_project"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.18.0", features = ["dynamic_linking", "experimental_bevy_feathers", "file_watcher"] }
avian2d = "0.6.0"
bevy_pancam = "0.20.0"
ron = "0.12.0"
serde = "1.0.228"
rand = "0.10.0"
bevy-inspector-egui = "0.36.0"
bevy_egui = "0.39.1"

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3
